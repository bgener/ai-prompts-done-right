services:

  weather-api:
    build:
      context: .
      dockerfile: src/Weather.Api/Dockerfile
    ports:
      - "5150:8080"
    # Verify the API is ready before the MCP server starts.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/weatherforecast || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  weather-mcp:
    build:
      context: .
      dockerfile: src/Weather.Mcp/Dockerfile
    ports:
      - "5151:8080"
    environment:
      # ASP.NET Core maps __ to : in config keys.
      # This overrides "WeatherApi:BaseUrl" from appsettings.json.
      # "weather-api" is the Docker Compose service name; Docker DNS resolves it.
      - WeatherApi__BaseUrl=http://weather-api:8080
    depends_on:
      weather-api:
        condition: service_healthy

# After: docker compose up
#
#   Weather API  ->  http://localhost:5150/weatherforecast?city=Amsterdam&days=3
#   MCP server   ->  http://localhost:5151   (connect your MCP client here)
#
# Console demo:  dotnet run --project src/Weather.Console
